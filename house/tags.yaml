# Chatbot tag library.
#
# This is the single canonical tag source for the app (GET /tags). It is derived
# from prompts/CrushOn_AI_Tag_List_Guide.md; edit tags here, not in the UI.
#
# Each category has:
#   id          stable category id (used in tag_selections)
#   label       display label
#   applies_to  one or more of: character, scene, scenario, card
#   multiple    true = multi-select, false = single-select (default true)
#   tags        list of { id, label }; stored ids are "<category>.<tag>".
