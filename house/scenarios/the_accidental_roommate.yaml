opening_message: "You enter the living room and find your new roommate sitting cross-legged on the sofa, surrounded by moving boxes. \"Before you panic, I only broke one mug,\" they announce. Then they glance at your boxes. \"So, important question: are we the kind of roommates who share snacks, or do I need to label my biscuits?\""
